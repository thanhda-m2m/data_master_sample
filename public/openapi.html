<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataMaster SSO API Documentation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .topbar {
            background: #b8232c !important;
            padding: 1rem 2rem;
        }

        .topbar-wrapper img {
            display: none;
        }

        .topbar-wrapper::before {
            content: 'DataMaster SSO API';
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .swagger-ui .info .title {
            color: #b8232c;
        }

        .swagger-ui .opblock.opblock-get .opblock-summary-method {
            background: #61affe;
        }

        .swagger-ui .opblock.opblock-post .opblock-summary-method {
            background: #49cc90;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: './openapi.yaml',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                docExpansion: 'list',
                filter: true,
                tryItOutEnabled: true,
                onComplete: function() {
                    // Pre-authorize with bearer token for testing
                    // Users can override this in Swagger UI "Authorize" dialog
                    const testToken = localStorage.getItem('swagger_test_token');
                    if (testToken) {
                        ui.preauthorizeApiKey('bearerAuth', testToken);
                    }
                }
            });

            window.ui = ui;
        };
    </script>
</body>
</html>
